<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <style>
    body { width: 340px; font-family: sans-serif; padding: 16px; background: #F8FAFC; color: #1E293B; }
    h2 { margin: 0 0 12px; font-size: 18px; color: #0F172A; display: flex; align-items: center; gap: 8px; }
    .badge { padding: 8px 12px; border-radius: 8px; font-weight: bold; font-size: 15px; margin-bottom: 12px; text-align: center; }
    .stage-0 { background: #DCFCE7; color: #166534; }
    .stage-1 { background: #FEF08A; color: #854D0E; }
    .stage-2, .stage-3 { background: #FEE2E2; color: #991B1B; }
    .log-box { background: white; border: 1px solid #CBD5E1; border-radius: 8px; padding: 10px; font-size: 13px; max-height: 150px; overflow-y: auto; margin-bottom: 12px; }
    button { width: 100%; padding: 10px; background: #2563EB; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; }
    button:hover { background: #1D4ED8; }
  </style>
</head>
<body>
  <h2>🛡️ 銀盾鏈 ShieldChain AI</h2>
  <div id="status-badge" class="badge stage-0">目前狀態：安全守護中 (Stage 0)</div>
  <div class="log-box" id="history-log">尚無異常行為鏈紀錄</div>
  <button id="reset-btn">🔄 重置行為鏈狀態（Demo 測試用）</button>
  <script src="popup.js"></script>
</body>
</html>
